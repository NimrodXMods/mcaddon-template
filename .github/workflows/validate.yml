name: Validate Add-on

on: [push, pull_request]

env:
  # Pinned rather than floating. @minecraft/creator-tools describes itself as
  # pre-release alpha; keep these in step with what you run locally, or CI and
  # your machine drift apart.
  MCT_VERSION: "0.17.8"
  REGOLITH_VERSION: "1.8.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Minecraft Creator Tools
        run: npm install -g "@minecraft/creator-tools@${MCT_VERSION}"

      # Release asset names embed the version, so /latest/download/<fixed-name>
      # never resolves. -f is essential: without it curl writes the 404 page
      # into the output file and tar fails with a confusing
      # "gzip: stdin: not in gzip format".
      - name: Install Regolith
        run: |
          url="https://github.com/Bedrock-OSS/regolith/releases/download/${REGOLITH_VERSION}/regolith_${REGOLITH_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o regolith.tar.gz "$url"
          tar -xzf regolith.tar.gz regolith
          sudo mv regolith /usr/local/bin/
          regolith --version

      # The one gate. Do not reimplement the error check inline here - see
      # AGENTS.md section 3g for why the obvious grep silently passes.
      # The "ci" profile exports to a local target; the default profile would
      # try to write into com.mojang, which does not exist on a CI runner.
      - name: Verify
        run: ./scripts/verify.sh ci

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: reports/
          if-no-files-found: warn
